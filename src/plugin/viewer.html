<!DOCTYPE html>
<html lang="en" ondragstart="return false">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="no-referrer">
    <meta name="format-detection" content="telephone=no,email=no,address=no">
    <title></title>
    <!-- inject:css -->
    <link rel="stylesheet" href="./viewer.less">
    <!-- endinject -->
</head>
<body>
    <main class="preview">
        <iframe class="preview-frame" title="Web Zip preview"></iframe>
        <div class="status" role="status" aria-live="polite">
            <span class="spinner" aria-hidden="true"></span>
            <p class="status-message"></p>
            <section class="npm-console" aria-labelledby="npm-console-title" hidden>
                <h2 class="npm-console-title" id="npm-console-title"></h2>
                <pre class="npm-output" aria-live="off"></pre>
            </section>
        </div>
        <section class="npm-consent" role="dialog" aria-modal="true" aria-labelledby="npm-consent-title" aria-describedby="npm-consent-message" hidden>
            <div class="npm-consent-card">
                <h1 class="npm-consent-title" id="npm-consent-title"></h1>
                <p class="npm-consent-message" id="npm-consent-message"></p>
                <div class="npm-consent-actions">
                    <button class="npm-consent-cancel" type="button"></button>
                    <button class="npm-consent-approve" type="button"></button>
                </div>
            </div>
        </section>
    </main>
    <!-- inject:js -->
    <script src="./viewer.js"></script>
    <!-- endinject -->
</body>
</html>
